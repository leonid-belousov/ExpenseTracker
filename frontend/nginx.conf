server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Same-origin API: the React app calls /api, nginx forwards to the backend.
    location /api/ {
        # Resolve `api` through Docker's DNS on each request (cached 10s) so a
        # restarted API container with a new IP is picked up, and fail fast
        # (502) instead of hanging when the API is down.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
    }

    # Vite emits content-hashed file names, so assets can be cached forever.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # `expires` (not add_header) keeps the server-level security headers.
        expires -1;
    }
}
